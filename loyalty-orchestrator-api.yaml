  schemas:
    Money:
      type: object
      description: An amount in minor units (cents), e.g. 12345 EUR is EUR 123.45.
      required: [value, currency]
      properties:
        value:
          type: integer
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Error:
      type: object
      required: [code, message, key, retryable, traceId]
      properties:
        code:
          type: string
          description: Stable machine code. Switch on it. See the error catalog in the guide.
        message:
          type: string
          description: English, for logs. Not for end users.
        key:
          type: string
          description: Localisation key for your own user-facing message.
        retryable:
          type: boolean
        traceId:
          type: string
          description: Quote it to support.
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds.
        scope:
          type: string
    NextStep:
      type: string
      description: |
        What you do next. Open enum: treat an unknown value as "not supported".
        `NONE` nothing, the result is final. `REDIRECT` open `redirectUrl` in a popup or system browser sheet.
        `SUBMIT_OTP` ask the member for the code and call `…/otp`. `SIGN_IN` the member must sign in first.
      enum: [NONE, REDIRECT, SUBMIT_OTP, SIGN_IN]
    Program:
      type: object
      required: [programCode, displayName, availability, authMode, burnStep, capabilities]
      properties:
        programCode:
          type: string
        displayName:
          type: string
        logoUrl:
          type: string
          format: uri
        pointsUnitLabel:
          type: string
          description: What the program calls its points, e.g. "Miles".
        availability:
          type: string
          enum: [AVAILABLE, DEGRADED, UNAVAILABLE]
        authMode:
          type: string
          description: How the member signs in. `REDIRECT` at the program's own page. `DIRECT_OTP` a code, no page.
          enum: [REDIRECT, DIRECT_OTP]
        burnStep:
          type: string
          description: The extra step a burn needs. The same values as `nextStep`.
          enum: [NONE, SUBMIT_OTP, REDIRECT]
        burnStepConditional:
          type: boolean
          description: True when the program can demand an OTP on some burns only. Always follow the runtime `nextStep`.
        savedLinkDays:
          type: [integer, "null"]
          description: How long a saved link lasts, in days. Null when the program has no saved link.
        memberNumber:
          type: object
          description: What to ask the member for a member-number check.
          properties:
            label:
              type: string
            pattern:
              type: string
              description: Format check only.
            nameFields:
              type: array
              items:
                type: string
                enum: [firstName, lastName]
        verticals:
          type: array
          description: Verticals that earn with this program. Open enum.
          items:
            type: string
            enum: [STAYS, CARS, FLIGHTS, ATTRACTIONS, TAXIS]
        eligibleLineTypes:
          type: array
          description: Line types that points can pay for. The quote applies it for you.
          items:
            $ref: "#/components/schemas/LineType"
        capabilities:
          type: object
          description: What this program supports through this API. A false flag means "not yet". Hide the feature.
          properties:
            memberNumberCheck:
              type: boolean
            savedLink:
              type: boolean
            earnWithoutSignIn:
              type: boolean
            tier:
              type: boolean
            benefits:
              type: boolean
            pointsExpiry:
              type: boolean
            partialReversal:
              type: boolean
    MemberContextRequest:
      type: object
      required: [programCode, redirectCompletionUrl]
      properties:
        programCode:
          type: string
        redirectCompletionUrl:
          type: string
          format: uri
          description: Your page the sign-in returns to. Its origin must be registered at onboarding.
        saveLink:
          type: boolean
          default: false
          description: The member opted in to stay linked. Honoured where `capabilities.savedLink` is true.
        riskContext:
          $ref: "#/components/schemas/RiskContext"
    MemberContext:
      type: object
      required: [contextRef, programCode, status, nextStep, expiresAt]
      properties:
        contextRef:
          type: string
        programCode:
          type: string
        status:
          type: string
          enum: [PENDING, READY, FAILED, CANCELLED, EXPIRED]
        nextStep:
          $ref: "#/components/schemas/NextStep"
        redirectUrl:
          type: string
          format: uri
          description: Present while `PENDING`. Open it in the popup.
        memberRef:
          type: string
          description: Present when `READY`.
        failureReason:
          type: string
          enum: [MEMBER_CANCELLED, SIGN_IN_FAILED, PROGRAM_UNAVAILABLE, EXPIRED]
        expiresAt:
          type: string
          format: date-time
    ValidateRequest:
      type: object
      required: [programCode, memberNumber, lastName]
      properties:
        programCode:
          type: string
        memberNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        riskContext:
          $ref: "#/components/schemas/RiskContext"
    ValidateResult:
      type: object
      required: [result, programCode]
      properties:
        result:
          type: string
          enum: [VERIFIED, NOT_VERIFIED]
        memberRef:
          type: string
          description: Present when `VERIFIED`. The same `memberRef` a later sign-in returns for this member.
        programCode:
          type: string
        linkLevel:
          $ref: "#/components/schemas/LinkLevel"
        memberNumberMasked:
          type: string
        tier:
          $ref: "#/components/schemas/Tier"
    LinkLevel:
      type: string
      description: |
        `SIGNED_IN` the member signed in: all member calls work. `NUMBER_VERIFIED` only the number was checked: tier and
        earn (where allowed), no balance or burn.
      enum: [SIGNED_IN, NUMBER_VERIFIED]
    Tier:
      type: object
      description: Present only when the program's `capabilities.tier` is true.
      required: [standard]
      properties:
        standard:
          type: string
          description: The Pointspay standard tier, the same scale for every program. Open enum.
          enum: [BASE, SILVER, GOLD, PLATINUM]
        programTierCode:
          type: string
        programTierName:
          type: string
    Benefit:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Open enum.
          enum: [FREE_BAGGAGE, PRIORITY_CHECKIN, SEAT_SELECTION, LOUNGE, OTHER]
        description:
          type: string
        validUntil:
          type: string
          format: date
    Member:
      type: object
      required: [memberRef, programCode, linkLevel]
      properties:
        memberRef:
          type: string
        programCode:
          type: string
        memberNumberMasked:
          type: string
        linkLevel:
          $ref: "#/components/schemas/LinkLevel"
        savedLink:
          type: object
          properties:
            active:
              type: boolean
            expiresAt:
              type: [string, "null"]
              format: date-time
        tier:
          $ref: "#/components/schemas/Tier"
        benefits:
          type: array
          description: Present only when the program's `capabilities.benefits` is true.
          items:
            $ref: "#/components/schemas/Benefit"
    MemberToken:
      type: object
      required: [memberToken, memberRef, expiresAt]
      properties:
        memberToken:
          type: string
        memberRef:
          type: string
        expiresAt:
          type: string
          format: date-time
    Balance:
      type: object
      required: [memberRef, programCode, points, asOf, source]
      properties:
        memberRef:
          type: string
        programCode:
          type: string
        points:
          type: integer
        pointsUnitLabel:
          type: string
        cashValue:
          $ref: "#/components/schemas/Money"
        expiringPoints:
          type: array
          description: Present only when the program's `capabilities.pointsExpiry` is true.
          items:
            type: object
            properties:
              points:
                type: integer
              expiresAt:
                type: string
                format: date
        asOf:
          type: string
          format: date-time
        source:
          type: string
          enum: [CACHED, LIVE]
    LineType:
      type: string
      description: Open enum.
      enum: [ROOM, FLIGHT, CAR, TAX, FEE, INSURANCE, BAGGAGE, SEAT, OTHER]
    Line:
      type: object
      required: [type, amount]
      properties:
        type:
          $ref: "#/components/schemas/LineType"
        amount:
          $ref: "#/components/schemas/Money"
    Rate:
      type: object
      description: "`points` points are worth `amount`. Already includes any burn promotion."
      required: [points, amount]
      properties:
        points:
          type: integer
        amount:
          $ref: "#/components/schemas/Money"
    Promotion:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
          description: Display text, e.g. for a badge ("3x Miles").
        multiplier:
          type: number
          description: Earn multiplier. Absent on burn promotions, whose effect is already in `rate`.
    QuoteRequest:
      type: object
      required: [programCode, memberRef, lines]
      properties:
        programCode:
          type: string
        memberRef:
          type: string
        lines:
          type: array
          minItems: 1
          description: The whole order, all in one currency.
          items:
            $ref: "#/components/schemas/Line"
        points:
          type: integer
          description: Points the member chose. Omit to pay the whole eligible amount.
        riskContext:
          $ref: "#/components/schemas/RiskContext"
    Quote:
      type: object
      required: [quoteRef, expiresAt, totalAmount, eligibleAmount, points, pointsValue, cashRemainder, rate, minPoints, maxPoints, pointsIncrement, nextStep]
      properties:
        quoteRef:
          type: string
        expiresAt:
          type: string
          format: date-time
        programCode:
          type: string
        memberRef:
          type: string
        totalAmount:
          $ref: "#/components/schemas/Money"
        eligibleAmount:
          $ref: "#/components/schemas/Money"
        points:
          type: integer
        pointsValue:
          $ref: "#/components/schemas/Money"
        cashRemainder:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        minPoints:
          type: integer
        maxPoints:
          type: integer
          description: Capped by the eligible amount and the member's balance.
        pointsIncrement:
          type: integer
        balance:
          type: integer
        appliedPromotions:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
        nextStep:
          description: The step the burn will need.
          $ref: "#/components/schemas/NextStep"
    RedemptionRequest:
      type: object
      required: [quoteRef, points, partnerOrderRef]
      properties:
        quoteRef:
          type: string
        points:
          type: integer
          description: Must equal the quote's points.
        partnerOrderRef:
          type: string
          description: Your order reference.
        entityCode:
          type: string
          description: Your legal entity for this order. Used for multi-entity reporting.
        relatedOperationRef:
          type: string
          description: Links an extra burn to an earlier one, e.g. a price increase on amendment.
        redirectCompletionUrl:
          type: string
          format: uri
          description: Where a `REDIRECT` step returns (`?operationRef=…&status=…`). Registered origin.
        riskContext:
          $ref: "#/components/schemas/RiskContext"
    OperationKind:
      type: string
      enum: [BURN, EARN]
    OperationStatus:
      type: string
      description: |
        Burn: `PENDING_VERIFICATION`, then `REDEEMED`, `FAILED` or `EXPIRED`. Earn: `SCHEDULED`, then `ACCRUED` or
        `FAILED`. Both, after reversals: `PARTIALLY_REVERSED`, then `REVERSED`. Pending or failed reversals appear only
        in `reversals[].status`.
      enum: [PENDING_VERIFICATION, REDEEMED, SCHEDULED, ACCRUED, FAILED, EXPIRED, PARTIALLY_REVERSED, REVERSED]
    InitiatedBy:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [API_KEY, OAUTH_CLIENT, OPERATOR]
        id:
          type: string
    StatusUpdate:
      type: object
      required: [at, status]
      properties:
        at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/OperationStatus"
        message:
          type: string
        initiatedBy:
          $ref: "#/components/schemas/InitiatedBy"
    Reversal:
      type: object
      required: [reversalRef, points, status, reasonCode, createdAt]
      properties:
        reversalRef:
          type: string
        points:
          type: integer
        pointsValue:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        failureCode:
          type: string
          description: Open enum, e.g. `INSUFFICIENT_BALANCE`, `PROGRAM_REJECTED`.
        reasonCode:
          $ref: "#/components/schemas/ReasonCode"
        partnerReversalRef:
          type: string
        componentRef:
          type: string
        initiatedBy:
          $ref: "#/components/schemas/InitiatedBy"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReasonCode:
      type: string
      description: Open enum.
      enum: [CANCELLATION, AMENDMENT, PAYMENT_FAILED, MEMBER_CHANGE, DISPUTE, CHARGEBACK, OTHER]
    ReverseRequest:
      type: object
      required: [reasonCode, partnerReversalRef]
      properties:
        points:
          type: integer
          description: Omit to reverse everything not yet reversed.
        reasonCode:
          $ref: "#/components/schemas/ReasonCode"
        partnerReversalRef:
          type: string
          description: Your cancellation, refund or dispute reference.
        componentRef:
          type: string
          description: Your label for the part of the order this reverses, e.g. one basket item.
        note:
          type: string
    Operation:
      type: object
      required: [operationRef, kind, programCode, memberRef, partnerOrderRef, status, points, reversedPoints, createdAt, updatedAt]
      properties:
        operationRef:
          type: string
        kind:
          $ref: "#/components/schemas/OperationKind"
        programCode:
          type: string
        memberRef:
          type: string
        partnerOrderRef:
          type: string
        entityCode:
          type: string
        relatedOperationRef:
          type: string
        status:
          $ref: "#/components/schemas/OperationStatus"
        points:
          type: integer
        pointsValue:
          $ref: "#/components/schemas/Money"
        reversedPoints:
          type: integer
        reversals:
          type: array
          items:
            $ref: "#/components/schemas/Reversal"
        statusUpdates:
          type: array
          items:
            $ref: "#/components/schemas/StatusUpdate"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Redemption:
      allOf:
        - $ref: "#/components/schemas/Operation"
        - type: object
          properties:
            nextStep:
              $ref: "#/components/schemas/NextStep"
            redirectUrl:
              type: string
              format: uri
              description: Present when `nextStep` is `REDIRECT`.
            otp:
              type: object
              description: Present when `nextStep` is `SUBMIT_OTP`.
              properties:
                maskedDestination:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                attemptsRemaining:
                  type: integer
                resendsRemaining:
                  type: integer
            balanceAfter:
              type: integer
    Travel:
      type: object
      properties:
        vertical:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        pnr:
          type: string
          description: Reference only. Flight miles for the ticket itself come from the airline, not from this API.
    AccrualRequest:
      type: object
      description: Send exactly one of `points`, `estimateRef` or `basisAmount`.
      required: [programCode, memberRef, partnerOrderRef]
      properties:
        programCode:
          type: string
        memberRef:
          type: string
        partnerOrderRef:
          type: string
        entityCode:
          type: string
        points:
          type: integer
        estimateRef:
          type: string
          description: Pins the estimate's points when used before its `validUntil`.
        basisAmount:
          description: The amount the member paid in cash. Pointspay applies the earn rules and campaigns.
          $ref: "#/components/schemas/Money"
        creditAfter:
          type: string
          format: date
          description: Hold the accrual (`SCHEDULED`) and credit on this date, e.g. the end of the stay.
        travel:
          $ref: "#/components/schemas/Travel"
        relatedOperationRef:
          type: string
          description: The burn on the same order, when earning on the cash part.
        riskContext:
          $ref: "#/components/schemas/RiskContext"
      oneOf:
        - required: [points]
        - required: [estimateRef]
        - required: [basisAmount]
    Accrual:
      allOf:
        - $ref: "#/components/schemas/Operation"
        - type: object
          properties:
            creditAfter:
              type: string
              format: date
            expectedCreditDate:
              type: string
              format: date
              description: When the member should see the points at the program.
            travel:
              $ref: "#/components/schemas/Travel"
    EstimateRequest:
      type: object
      required: [programCodes, items]
      properties:
        programCodes:
          type: array
          items:
            type: string
        memberRef:
          type: string
          description: Optional. Adds tier bonuses and targeted campaigns.
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [itemRef, vertical, amount]
            properties:
              itemRef:
                type: string
              vertical:
                type: string
              amount:
                $ref: "#/components/schemas/Money"
              lines:
                type: array
                items:
                  $ref: "#/components/schemas/Line"
    EstimateResult:
      type: object
      required: [validUntil, items]
      properties:
        validUntil:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [itemRef, estimates]
            properties:
              itemRef:
                type: string
              estimates:
                type: array
                items:
                  type: object
                  required: [programCode, estimateRef, points]
                  properties:
                    programCode:
                      type: string
                    estimateRef:
                      type: string
                    points:
                      type: integer
                    breakdown:
                      type: object
                      properties:
                        base:
                          type: integer
                        promotion:
                          type: integer
                        tier:
                          type: integer
                    appliedPromotions:
                      type: array
                      items:
                        $ref: "#/components/schemas/Promotion"
                    creditDelayDays:
                      type: integer
                      description: Days after the end of travel until the member should see the points.
    RiskContext:
      type: object
      description: Your fraud signals. Send them on member-context, validate, quote, burn and accrual.
      properties:
        ipAddress:
          type: string
        deviceId:
          type: string
        partnerRiskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Your score, 0 to 100, higher is riskier.
    EventClaims:
      type: object
      description: |
        The decoded payload of a signed webhook (compact JWS, RS256/384/512). Verify it against the JWKS at
        `https://api.pointspay.com/loyalty/v1/.well-known/jwks.json`, check `iss`, `aud` and `exp`, and dedupe on `jti`.
        Every delivery attempt is signed again with a fresh `iat` and `exp` and the same `jti`.
      required: [iss, aud, jti, iat, exp, evt]
      properties:
        iss:
          type: string
          const: https://api.pointspay.com/loyalty/v1
        aud:
          type: string
          description: Your partner code.
        jti:
          type: string
        iat:
          type: integer
        exp:
          type: integer
        evt:
          type: string
          enum: [member-context.completed, operation.updated, reversal.updated]
        ctx:
          type: string
          description: Context reference (member-context.completed).
        mrf:
          type: string
          description: Member reference (member-context.completed, when READY).
        rsn:
          type: string
          description: Failure reason (member-context.completed, when not READY).
        opr:
          type: string
          description: Operation reference.
        knd:
          $ref: "#/components/schemas/OperationKind"
        prg:
          type: string
          description: Program code.
        stat:
          type: string
          description: Sign-in status, or operation status.
        pts:
          type: integer
          description: Points of the operation.
        rpts:
          type: integer
          description: Reversed points so far.
        rvr:
          type: string
          description: Reversal reference (reversal.updated).
        rstat:
          type: string
          description: Reversal status (reversal.updated).
        cref:
          type: string
          description: Component reference (reversal.updated).
        pref:
          type: string
          description: Your partnerOrderRef.
        oat:
          type: string
          format: date-time
          description: When the change happened.
